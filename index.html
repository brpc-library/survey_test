<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기술트리 수요조사</title>
<style>
  :root{
    --ink:#1c2230;
    --paper:#f6f5f1;
    --panel:#ffffff;
    --line:#d8d5cb;
    --branch:#2f6f5e;   /* 대분류 */
    --branch-2:#5b7fae; /* 중분류 */
    --branch-3:#9a6b3f; /* 소분류 */
    --accent:#c65b3a;   /* 핵심기술 강조 */
    --muted:#767267;
    --focus:#2f6f5e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
    line-height:1.5;
    padding-bottom:120px;
  }
  .wrap{max-width:920px;margin:0 auto;padding:36px 20px 60px;}

  header.top{
    border-bottom:2px solid var(--ink);
    padding-bottom:18px;
    margin-bottom:24px;
  }
  .eyebrow{
    font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
    font-size:12px;
    letter-spacing:.12em;
    color:var(--muted);
    text-transform:uppercase;
  }
  h1{
    font-size:28px;
    margin:6px 0 8px;
    letter-spacing:-0.01em;
  }
  .desc{color:var(--muted);font-size:14px;max-width:640px;}

  .respondent{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 18px;
    margin:20px 0 28px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px 16px;
  }
  .respondent .field{display:flex;flex-direction:column;gap:4px;}
  .respondent label{font-size:12px;color:var(--muted);font-weight:600;}
  .respondent input{
    border:1px solid var(--line);
    border-radius:6px;
    padding:8px 10px;
    font-size:14px;
    font-family:inherit;
  }
  .respondent input:focus{outline:2px solid var(--focus);outline-offset:1px;}

  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    font-size:13px;
  }
  .toolbar .count{color:var(--muted);}
  .toolbar .btns button{
    background:none;
    border:1px solid var(--ink);
    color:var(--ink);
    border-radius:6px;
    padding:6px 12px;
    font-size:12px;
    cursor:pointer;
    margin-left:6px;
    font-family:inherit;
  }
  .toolbar .btns button:hover{background:var(--ink);color:var(--paper);}

  /* ---- Tree levels ---- */
  details.level{
    border-left:3px solid var(--line);
    margin-bottom:8px;
    background:var(--panel);
    border-radius:0 8px 8px 0;
  }
  details.level > summary{
    list-style:none;
    cursor:pointer;
    padding:12px 14px;
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
    user-select:none;
  }
  details.level > summary::-webkit-details-marker{display:none;}
  summary .arrow{
    display:inline-block;
    transition:transform .15s ease;
    font-size:11px;
    color:var(--muted);
    width:12px;
  }
  details[open] > summary .arrow{transform:rotate(90deg);}

  .lv-major{border-left-color:var(--branch);}
  .lv-major > summary{font-size:17px;color:var(--branch);}
  .lv-major .tag{background:var(--branch);}

  .lv-mid{border-left-color:var(--branch-2);margin:8px 10px 8px 14px;}
  .lv-mid > summary{font-size:15px;color:var(--branch-2);}
  .lv-mid .tag{background:var(--branch-2);}

  .lv-sub{border-left-color:var(--branch-3);margin:8px 10px 8px 14px;background:#fbfaf7;}
  .lv-sub > summary{font-size:14px;color:var(--branch-3);}
  .lv-sub .tag{background:var(--branch-3);}

  .tag{
    font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
    font-size:10px;
    color:#fff;
    padding:2px 6px;
    border-radius:4px;
    letter-spacing:.03em;
  }
  .body-inner{padding:4px 14px 14px 20px;}

  /* ---- 핵심기술 row ---- */
  .tech{
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    padding:12px 14px;
    margin:10px 4px 10px 10px;
  }
  .tech.checked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
  .tech-head{
    display:flex;
    align-items:flex-start;
    gap:10px;
  }
  .tech-head input[type=checkbox]{
    width:18px;height:18px;
    margin-top:2px;
    accent-color:var(--accent);
    flex-shrink:0;
    cursor:pointer;
  }
  .tech-name{font-weight:700;font-size:14px;color:var(--ink);}
  .tech-examples{
    font-size:12px;
    color:var(--muted);
    margin-top:3px;
  }
  .tech-examples b{color:var(--muted);font-weight:600;}
  .example-chip{
    display:inline-block;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:1px 8px;
    margin:2px 3px 0 0;
    font-size:11px;
  }

  .tech-detail{
    display:none;
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--line);
    gap:14px;
  }
  .tech.checked .tech-detail{display:flex;flex-wrap:wrap;}

  .priority-group{display:flex;flex-direction:column;gap:6px;min-width:170px;}
  .priority-group .lbl{font-size:11px;color:var(--muted);font-weight:600;}
  .priority-opts{display:flex;gap:6px;}
  .priority-opts label{
    border:1px solid var(--line);
    border-radius:6px;
    padding:5px 10px;
    font-size:12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:4px;
  }
  .priority-opts input{accent-color:var(--accent);}
  .priority-opts input:checked + span{font-weight:700;}
  .priority-opts label:has(input:checked){border-color:var(--accent);background:#fbeee9;}

  .comment-group{flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px;}
  .comment-group .lbl{font-size:11px;color:var(--muted);font-weight:600;}
  .comment-group textarea{
    width:100%;
    resize:vertical;
    min-height:44px;
    border:1px solid var(--line);
    border-radius:6px;
    padding:8px 10px;
    font-size:13px;
    font-family:inherit;
  }
  .comment-group textarea:focus{outline:2px solid var(--focus);outline-offset:1px;}

  /* ---- footer / submit ---- */
  .submit-bar{
    position:fixed;
    left:0;right:0;bottom:0;
    background:var(--panel);
    border-top:1px solid var(--line);
    padding:14px 20px;
    display:flex;
    justify-content:center;
    gap:12px;
    align-items:center;
    box-shadow:0 -4px 12px rgba(0,0,0,.04);
  }
  .submit-bar .inner{max-width:920px;width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .status{font-size:13px;color:var(--muted);}
  .status.ok{color:var(--branch);font-weight:700;}
  .status.err{color:var(--accent);font-weight:700;}
  button.primary{
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:11px 22px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  button.primary:hover{background:var(--branch);}
  button.primary:disabled{opacity:.5;cursor:default;}
  button.ghost{
    background:none;
    border:1px solid var(--line);
    color:var(--muted);
    border-radius:8px;
    padding:11px 16px;
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
  }

  @media (max-width:600px){
    .respondent{grid-template-columns:1fr;}
    .submit-bar .inner{flex-direction:column;align-items:stretch;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="eyebrow">Technology Roadmap · 수요조사</div>
    <h1>기술트리 수요조사</h1>
    <p class="desc">대분류 → 중분류 → 소분류 순으로 펼쳐지며, 각 핵심기술 항목에서 개발 필요 여부와 우선순위, 의견을 남겨주세요. 총 대분류 4개 · 중분류 25개 · 소분류 65개 · 핵심기술 145개로 구성되어 있어 처음엔 첫 번째 대분류만 펼쳐져 있습니다. 관심 있는 분류만 펼쳐서 확인해주세요.</p>
  </header>

  <div class="respondent">
    <div class="field">
      <label for="r-name">이름 / 소속 (필수)</label>
      <input id="r-name" type="text" required placeholder="예: 홍길동 / OO연구실">
    </div>
    <div class="field">
      <label for="r-email">이메일 (필수 · 중복 제출 확인용)</label>
      <input id="r-email" type="email" required placeholder="예: name@company.com">
    </div>
  </div>

  <div class="toolbar">
    <span class="count" id="checkedCount">선택된 핵심기술: 0개</span>
    <span class="btns">
      <button type="button" id="expandAll">전체 펼치기</button>
      <button type="button" id="collapseAll">전체 접기</button>
    </span>
  </div>

  <div id="tree"></div>
</div>

<div class="submit-bar">
  <div class="inner">
    <span class="status" id="statusMsg">응답을 마치면 제출 버튼을 눌러주세요.</span>
    <span>
      <button type="button" class="ghost" id="downloadBtn">결과 파일로 저장</button>
      <button type="button" class="primary" id="submitBtn">응답 제출하기</button>
    </span>
  </div>
</div>

                "name": "뇌자극 반응 예측 기술",
                "examples": [
                  "Brain Stimulation Modeling",
                  "Computational Neuroscience"
                ]
              }
            ]
          },
          {
            "name": "뇌지도 기반 활용",
            "techs": [
              {
                "name": "BCI·뇌자극 연계 활용 기술",
                "examples": [
                  "Closed-loop Control",
                  "Computational Neurostimulation",
                  "Brain-Computer Co-modeling"
                ]
              },
              {
                "name": "신약개발·가상임상 활용 기술",
                "examples": [
                  "In silico Trial",
                  "Computational Disease Modeling"
                ]
              }
            ]
          }
        ]
      }
    ]
  }
];

/* =========================================================
   3) 렌더링
========================================================= */
let techCounter = 0;
const treeRoot = document.getElementById("tree");

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}

function renderTech(tech, path){
  techCounter += 1;
  const id = "tech_" + techCounter;
  const box = el("div", "tech");
  box.dataset.majorcat = path[0];
  box.dataset.midcat = path[1];
  box.dataset.subcat = path[2];
  box.dataset.techname = tech.name;

  const exHtml = (tech.examples || [])
    .map(x => `<span class="example-chip">${x}</span>`)
    .join("");

  box.innerHTML = `
    <div class="tech-head">
      <input type="checkbox" id="${id}_chk">
      <div>
        <label class="tech-name" for="${id}_chk">${tech.name}</label>
        <div class="tech-examples"><b>관련 기법 예시</b> · ${exHtml || "-"}</div>
      </div>
    </div>
    <div class="tech-detail">
      <div class="priority-group">
        <span class="lbl">우선순위</span>
        <div class="priority-opts">
          <label><input type="radio" name="${id}_pri" value="상"><span>상</span></label>
          <label><input type="radio" name="${id}_pri" value="중"><span>중</span></label>
          <label><input type="radio" name="${id}_pri" value="하"><span>하</span></label>
        </div>
      </div>
      <div class="comment-group">
        <span class="lbl">자유 의견 (현재 기술 수준, 필요 이유 등)</span>
        <textarea id="${id}_cmt" placeholder="예: 현재 기술 수준은 TRL 3~4 수준이며, 2년 내 확보가 필요"></textarea>
      </div>
    </div>
  `;

  const chk = box.querySelector(`#${id}_chk`);
  chk.addEventListener("change", () => {
    box.classList.toggle("checked", chk.checked);
    updateCount();
  });

  // 우선순위 라디오: 이미 선택된 항목을 다시 클릭하면 선택 해제
  box.querySelectorAll(".priority-opts input[type=radio]").forEach(radio => {
    radio.addEventListener("mousedown", () => {
      radio.dataset.wasChecked = radio.checked;
    });
    radio.addEventListener("click", () => {
      if (radio.dataset.wasChecked === "true") {
        radio.checked = false;
      }
    });
  });

  return box;
}

function renderSub(sub, path){
  const details = el("details", "level lv-sub");
  details.innerHTML = `<summary><span class="arrow">▶</span><span class="tag">소분류</span> ${sub.name}</summary>`;
  const inner = el("div", "body-inner");
  sub.techs.forEach(t => inner.appendChild(renderTech(t, [...path, sub.name])));
  details.appendChild(inner);
  return details;
}

function renderMid(mid, path){
  const details = el("details", "level lv-mid");
  details.innerHTML = `<summary><span class="arrow">▶</span><span class="tag">중분류</span> ${mid.name}</summary>`;
  const inner = el("div", "body-inner");
  mid.children.forEach(s => inner.appendChild(renderSub(s, [...path, mid.name])));
  details.appendChild(inner);
  return details;
}

function renderMajor(major, idx){
  const details = el("details", "level lv-major");
  details.open = (idx === 0);
  details.innerHTML = `<summary><span class="arrow">▶</span><span class="tag">대분류</span> ${major.name}</summary>`;
  const inner = el("div", "body-inner");
  major.children.forEach(m => inner.appendChild(renderMid(m, [major.name])));
  details.appendChild(inner);
  return details;
}

DATA.forEach((major, idx) => treeRoot.appendChild(renderMajor(major, idx)));

/* =========================================================
   4) 전체 펼치기 / 접기
========================================================= */
document.getElementById("expandAll").addEventListener("click", () => {
  document.querySelectorAll("details.level").forEach(d => d.open = true);
});
document.getElementById("collapseAll").addEventListener("click", () => {
  document.querySelectorAll("details.level").forEach(d => d.open = false);
});

/* =========================================================
   5) 선택 개수 카운트
========================================================= */
function updateCount(){
  const n = document.querySelectorAll(".tech input[type=checkbox]:checked").length;
  document.getElementById("checkedCount").textContent = `선택된 핵심기술: ${n}개`;
}

/* =========================================================
   6) 응답 수집
========================================================= */
function collectResponses(){
  const items = [];
  document.querySelectorAll(".tech").forEach(box => {
    const chk = box.querySelector("input[type=checkbox]");
    if(!chk.checked) return;
    const pri = box.querySelector("input[type=radio]:checked");
    const cmt = box.querySelector("textarea");
    items.push({
      majorCategory: box.dataset.majorcat,
      middleCategory: box.dataset.midcat,
      subCategory: box.dataset.subcat,
      techName: box.dataset.techname,
      priority: pri ? pri.value : "",
      comment: cmt ? cmt.value.trim() : ""
    });
  });
  return {
    respondentName: document.getElementById("r-name").value.trim(),
    respondentEmail: document.getElementById("r-email").value.trim(),
    submittedAt: new Date().toISOString(),
    items
  };
}

/* =========================================================
   7) 파일로 저장 (백업/오프라인 전달용)
========================================================= */
document.getElementById("downloadBtn").addEventListener("click", () => {
  const data = collectResponses();
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  const namePart = data.respondentName ? data.respondentName.replace(/\s+/g,"_") : "응답자";
  a.download = `기술트리_수요조사_${namePart}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

/* =========================================================
   8) 구글시트로 제출
========================================================= */
document.getElementById("submitBtn").addEventListener("click", async () => {
  const statusEl = document.getElementById("statusMsg");
  const data = collectResponses();

  if(!data.respondentName){
    statusEl.textContent = "이름/소속을 입력해주세요.";
    statusEl.className = "status err";
    return;
  }
  if(!data.respondentEmail){
    statusEl.textContent = "이메일을 입력해주세요. (중복 제출 확인에 사용됩니다)";
    statusEl.className = "status err";
    return;
  }
  if(data.items.length === 0){
    statusEl.textContent = "체크된 핵심기술이 없습니다. 개발이 필요한 항목을 선택해주세요.";
    statusEl.className = "status err";
    return;
  }
  if(!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("여기에")){
    statusEl.textContent = "제출 서버가 아직 설정되지 않았어요. '결과 파일로 저장'을 이용해주세요.";
    statusEl.className = "status err";
    return;
  }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  statusEl.textContent = "제출 중...";
  statusEl.className = "status";

  try{
    const resp = await fetch(GAS_WEB_APP_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify(data)
    });
    const result = await resp.json();

    if(result.result === "duplicate"){
      statusEl.textContent = "이미 이 이메일로 제출된 응답이 있습니다. 수정이 필요하면 담당자에게 문의해주세요.";
      statusEl.className = "status err";
      btn.disabled = false;
    }else if(result.result === "success"){
      statusEl.textContent = "제출이 완료되었습니다. 참여해주셔서 감사합니다!";
      statusEl.className = "status ok";
    }else{
      statusEl.textContent = "제출 중 문제가 발생했습니다. '결과 파일로 저장' 후 담당자에게 전달해주세요.";
      statusEl.className = "status err";
      btn.disabled = false;
    }
  }catch(err){
    // 서버까지 요청은 전달됐을 수 있지만, 결과 확인에 실패한 경우
    statusEl.textContent = "제출은 전송했지만 결과 확인에 실패했습니다. 구글시트에서 반영 여부를 확인하거나, 안 보이면 '결과 파일로 저장' 후 담당자에게 전달해주세요.";
    statusEl.className = "status err";
    btn.disabled = false;
  }
});
</script>
